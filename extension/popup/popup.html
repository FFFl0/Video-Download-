<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="20" height="20">
    <h1 data-i18n="popupTitle"></h1>
    <span id="count" class="count"></span>
  </header>

  <main>
    <ul id="list" class="list"></ul>
    <div id="empty" class="empty" hidden>
      <div class="empty-title" data-i18n="emptyTitle"></div>
      <div class="empty-hint" id="empty-hint" data-i18n="emptyHint"></div>
    </div>
  </main>

  <footer>
    <label class="switch">
      <input type="checkbox" id="ask-where">
      <span data-i18n="askWhere"></span>
    </label>
    <span id="status" class="status" role="status"></span>
  </footer>

  <template id="item-tpl">
    <li class="item">
      <div class="row">
        <input class="name" type="text" spellcheck="false">
        <span class="ext"></span>
      </div>
      <div class="meta">
        <span class="badge quality" hidden></span>
        <span class="info"></span>
      </div>
      <div class="note" hidden></div>
      <div class="row actions">
        <a class="host" target="_blank" rel="noreferrer"></a>
        <select class="variant" hidden></select>
        <button class="download" type="button"></button>
      </div>
      <div class="progress" hidden>
        <div class="bar"><div class="fill"></div></div>
        <div class="row">
          <span class="ptext"></span>
          <button class="cancel" type="button"></button>
        </div>
      </div>
    </li>
  </template>

  <script src="popup.js"></script>
</body>
</html>
